# nginx site for static davidcoen.it Tor copy (portable)
# Used inside deploy/portable-tor docker compose.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tor Browser / privacy: no referrer leakage extras needed;
    # avoid sending identifying server tokens.
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
