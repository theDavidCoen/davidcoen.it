<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <script>
    (function () {
      var theme = localStorage.getItem("davidcoen_theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
    <title>Bitcoin Difficulty and Halving Countdown</title>
    <link rel="stylesheet" href="/resources/shared/site.css">
</head>
<body>
  <main class="wrap">
    <div id="tool-header"></div>
    
    <p id="difficulty-countdown"></p>
    <h1>Estimated Difficulty Change</h1>
    <p id="difficulty-change"></p>
    <h1>Bitcoin Halving Countdown</h1>
    <p id="halving-countdown"></p>

    <script>
      // Bitcoin block time is 10 minutes
      const blockTime = 10 * 60 * 1000;
      
      // Halving interval in blocks
      const halvingInterval = 210000;

      // Calculate the dates for the next difficulty adjustment and halving
      const currentTime = new Date().getTime();
      
      // Use CoinGecko API to retrieve the data
      fetch("https://api.coingecko.com/api/v3/coins/bitcoin")
        .then(response => response.json())
        .then(data => {
          const blocksTillDifficulty = data.block_time_in_minutes * 60 / 10;
          const difficultyAdjustmentTime = currentTime + blocksTillDifficulty * blockTime;
          
          const nextHalvingBlock = data.last_blocks[0].height + halvingInterval;
          const blocksTillHalving = nextHalvingBlock - data.last_blocks[0].height;
          const halvingTime = currentTime + blocksTillHalving * blockTime;
          
          // Set the text for the countdown to the next difficulty adjustment
          document.getElementById("difficulty-countdown").innerHTML =
            "Time until next difficulty adjustment: " +
            (difficultyAdjustmentTime - currentTime) / 1000 +
            " seconds";
          
          // Set the text for the estimated difficulty change
          document.getElementById("difficulty-change").innerHTML =
            "Estimated change in difficulty: " + data.difficulty_change_percentage + "%";
          
          // Set the text for the countdown to the next halving
          document.getElementById("halving-countdown").innerHTML =
            "Time until next halving: " +
            (halvingTime - currentTime) / 1000 +
            " seconds";
        });
    </script>
  </main>
  <script src="/resources/shared/site.js"></script>
  <script>
    ResourcesSite.mountToolHeader({
      title: 'Bitcoin Difficulty Adjustment Countdown',
      clientSide: true,
    });
  </script>
  <script src="/resources/shared/theme-toggle.js" defer></script>
</body>
</html>
</html>
