      body {
        background: #1b2f3b;
        background-image: linear-gradient(135deg, #06090c 0, #1b2f3b 100%);
        font: 300 18px/2em Nunito, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-size: 16px;
        line-height: 28px;
        margin: 0;
        padding: 0;
      }

      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        padding: 2rem 1rem 3rem;
        box-sizing: border-box;
      }

      .wrap.has-results {
        align-items: flex-start;
      }

      .container {
        text-align: center;
        padding: 1rem;
        max-width: 42rem;
        width: 100%;
        box-sizing: border-box;
      }

      a {
        color: #fff;
      }

      a:hover {
        color: #66eda8;
      }

      a.button,
      button.button {
        margin: 0 15px;
        transition: all 250ms cubic-bezier(0.23, 1, 0.32, 1);
        display: inline-block;
        text-decoration: none;
        padding: 10px 30px;
        border: 2px solid #fff;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      a.button:hover,
      button.button:hover {
        border-color: #66eda8;
        color: #66eda8;
      }

      .lead {
        margin: 1.25rem 0 0.75rem;
      }

      #orderID {
        display: block;
        width: 100%;
        max-width: 32rem;
        margin: 0 auto 1rem;
        box-sizing: border-box;
        padding: 10px 14px;
        border: 2px solid #fff;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font: inherit;
        resize: vertical;
        min-height: 3.25rem;
      }

      #orderID::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      #orderID:focus {
        outline: none;
        border-color: #66eda8;
      }

      .search-row {
        margin-bottom: 1.25rem;
      }

      #results {
        text-align: left;
        margin: 0 auto 1.5rem;
        max-width: 32rem;
      }

      .status-msg {
        text-align: center;
        margin: 0.75rem 0;
      }

      .status-msg.warn {
        color: #66eda8;
      }

      .result-card {
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 16px 18px;
        margin: 0 0 12px;
        line-height: 1.45;
        overflow-wrap: break-word;
      }

      .result-card h2 {
        margin: 0 0 4px;
        font-size: 1.05em;
        font-weight: 400;
        line-height: 1.3;
      }

      .result-kind {
        color: #66eda8;
        font-size: 0.85em;
        margin: 0 0 10px;
        line-height: 1.35;
      }

      .result-card p {
        margin: 0.4rem 0;
      }

      .result-actions {
        margin: 10px 0 2px;
      }

      a.button.result-link {
        margin: 0 8px 8px 0;
        padding: 6px 16px;
        font-size: 0.9em;
        line-height: 1.3;
      }

      .footnote {
        font-size: 0.9em;
        opacity: 0.9;
        line-height: 1.55;
        margin-top: 1.5rem;
        text-align: left;
      }

      .wrap.has-results .footnote {
        display: none;
      }

      .footnote code {
        font-family: inherit;
        color: #66eda8;
      }

      @media (min-width: 768px) {
        body {
          font-size: 18px;
          line-height: 32px;
        }
      }
    </style>
</head>

      <p class="lead">Enter the partner order ID, or paste Edge Exchange Details.</p>
      <textarea id="orderID" rows="3" placeholder="Order ID or Exchange Details"></textarea>
      <div class="search-row">
        <button type="button" class="button" id="searchButton">Search</button>
      </div>
      <div id="results"></div>
      <p class="footnote">
        Partner order IDs are not blockchain txids. A 64-character hex hash
        (or <code>0x</code> + 64 hex) is an on-chain transaction — CEX partners
        cannot look it up. DEX swaps (Maya Protocol, THORChain) use that hash
        and often have an empty Order ID.
      </p>
