<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var theme = localStorage.getItem("davidcoen_theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay health checker | DAVIDCOEN.IT Resources</title>
  <link rel="stylesheet" href="/resources/shared/site.css">
</head>
<body>
  <main class="wrap">
    <div id="tool-header"></div>
    <section class="card">
      <label for="relay">Relay URL</label>
      <input type="url" id="relay" value="https://relay.davidcoen.it/">
      <button type="button" id="checkBtn">Run checks</button>
      <div id="result" class="result" hidden></div>
    </section>
  </main>
  <script src="/resources/shared/site.js"></script>
  <script src="/resources/relay-health/app.js"></script>
  <script src="/resources/shared/theme-toggle.js" defer></script>
</body>
</html>
