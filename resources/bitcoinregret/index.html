<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var theme = localStorage.getItem("davidcoen_theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitcoin regret calculator | DAVIDCOEN.IT Resources</title>
  <link rel="stylesheet" href="/resources/shared/site.css">
</head>
<body>
  <main class="wrap">
    <div id="tool-header"></div>
    <p>Enter an amount and year to see how much bitcoin that purchase could have been.</p>
    <p>
      <label for="amount">USD spent: </label>
      <input type="number" id="amount" min="1" step="0.01" value="100" size="8">
      <label for="year"> in </label>
      <select id="year"></select>
      <label for="goods"> for </label>
      <input type="text" id="goods" placeholder="pizza…" size="16">
    </p>
    <p><button type="button" id="calculate">Calculate regret</button></p>
    <div id="result" class="result" hidden></div>
  </main>
  <script src="/resources/shared/site.js"></script>
  <script src="/resources/bitcoinregret/app.js"></script>
  <script src="/resources/shared/theme-toggle.js" defer></script>
</body>
</html>
