<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var theme = localStorage.getItem("davidcoen_theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitcoin blockchain size chart | DAVIDCOEN.IT Resources</title>
  <link rel="stylesheet" href="/resources/shared/site.css?v=20260903-tools">
  <link rel="stylesheet" href="/resources/blockchainchart/chart.css?v=20260903-tools">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
</head>
<body>
  <main class="wrap wrap-wide">
    <div id="tool-header"></div>
    <p class="muted">Total size of Bitcoin block headers and transactions, from Blockchain.com.</p>
    <p id="headline" class="stat-value">Loading…</p>
    <p id="subhead" class="muted"></p>
    <p class="range-row" role="group" aria-label="Time range">
      <button type="button" data-span="1year">1 year</button>
      <button type="button" data-span="5years">5 years</button>
      <button type="button" data-span="all" class="is-active">All time</button>
    </p>
    <p id="status" class="muted"></p>
    <div class="chart-wrap">
      <canvas id="sizeChart" aria-label="Bitcoin blockchain size over time"></canvas>
    </div>
    <p class="muted">Source: Blockchain.com charts API. Values in GB (1000 MB).</p>
  </main>
  <script src="/resources/shared/site.js"></script>
  <script src="/resources/blockchainchart/app.js?v=20260903-tools"></script>
  <script src="/resources/shared/theme-toggle.js" defer></script>
</body>
</html>
